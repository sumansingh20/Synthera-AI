version: "3.9"

services:
  api:
    build:
      context: .
      target: api
    container_name: synthera-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./reports_output:/app/reports_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - synthera-net

  frontend:
    build:
      context: .
      target: frontend
    container_name: synthera-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - synthera-net

  chromadb:
    image: chromadb/chroma:latest
    container_name: synthera-chromadb
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - synthera-net

volumes:
  chroma_data:

networks:
  synthera-net:
    driver: bridge
