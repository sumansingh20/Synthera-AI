<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 24" width="1280" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="0.75" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes slide { 0%{transform:translateX(-200px)} 100%{transform:translateX(200px)} }
    .s{animation:slide 6s linear infinite}
  </style>
  <line x1="60" y1="12" x2="1220" y2="12" stroke="#1f2a44" stroke-width="2" stroke-linecap="round"/>
  <g class="s">
    <line x1="60" y1="12" x2="1220" y2="12" stroke="url(#dg)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
