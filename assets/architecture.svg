<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-label="Synthera architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.5" stop-color="#0a0f2b"/>
      <stop offset="1" stop-color="#150b30"/>
    </linearGradient>
    <linearGradient id="atitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd">
        <animate attributeName="stop-color" values="#c4b5fd;#67e8f9;#c4b5fd" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#c084fc;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="abloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <path id="looppath" d="M935 500 C 935 462, 365 462, 365 498" fill="none"/>
  </defs>

  <style>
    @keyframes drift { 0%{transform:translate(0,0)} 50%{transform:translate(18px,-14px)} 100%{transform:translate(0,0)} }
    @keyframes blink { 0%,100%{opacity:.35;r:4} 50%{opacity:1;r:7} }
    @keyframes dash { to { stroke-dashoffset: -120; } }
    @keyframes sweep { 0%{transform:translateX(-360px)} 100%{transform:translateX(1340px)} }
    .drift{animation:drift 10s ease-in-out infinite}
    .b1{animation:blink 2.6s ease-in-out infinite}
    .b2{animation:blink 2.6s ease-in-out infinite .6s}
    .b3{animation:blink 2.6s ease-in-out infinite 1.2s}
    .b4{animation:blink 2.6s ease-in-out infinite 1.8s}
    .loop{stroke-dasharray:8 8;animation:dash 4.5s linear infinite}
    .sweep{animation:sweep 7s linear infinite}
  </style>

  <rect width="1280" height="840" fill="url(#abg)"/>
  <rect width="1280" height="840" fill="url(#agrid)"/>
  <g class="drift"><circle cx="200" cy="120" r="260" fill="url(#abloom)"/></g>
  <g class="drift"><circle cx="1080" cy="720" r="260" fill="url(#abloom)"/></g>

  <text x="640" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#atitle)">Synthera — System Architecture</text>
  <text x="640" y="74" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#93a3c4">Streamlit UI · FastAPI · LangGraph multi-agent pipeline · RAG · Observability</text>

  <!-- Frontend -->
  <rect x="180" y="100" width="920" height="112" rx="16" fill="#0f1733" stroke="#7c3aed" stroke-opacity="0.55"/>
  <text x="210" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">Streamlit Frontend</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <rect x="210" y="152" width="270" height="42" rx="10" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-opacity="0.4"/>
    <text x="345" y="179" text-anchor="middle">Query Input &amp; Chat</text>
    <rect x="500" y="152" width="270" height="42" rx="10" fill="#4f46e5" fill-opacity="0.14" stroke="#4f46e5" stroke-opacity="0.4"/>
    <text x="635" y="179" text-anchor="middle">Live Progress Tracking</text>
    <rect x="790" y="152" width="290" height="42" rx="10" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-opacity="0.4"/>
    <text x="935" y="179" text-anchor="middle">Report &amp; Citations Viewer</text>
  </g>

  <line x1="640" y1="212" x2="640" y2="258" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="5" fill="#22d3ee">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M640 214 L640 256"/>
  </circle>
  <text x="660" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#67e8f9">REST / HTTP</text>

  <!-- Backend -->
  <rect x="180" y="266" width="920" height="112" rx="16" fill="#0f1733" stroke="#4f46e5" stroke-opacity="0.55"/>
  <text x="210" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a5b4fc">FastAPI Backend</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1">
    <rect x="210" y="318" width="200" height="42" rx="10" fill="#4f46e5" fill-opacity="0.14" stroke="#4f46e5" stroke-opacity="0.4"/>
    <text x="310" y="345" text-anchor="middle">/health</text>
    <rect x="430" y="318" width="300" height="42" rx="10" fill="#4f46e5" fill-opacity="0.14" stroke="#4f46e5" stroke-opacity="0.4"/>
    <text x="580" y="345" text-anchor="middle">/research/* async tasks</text>
    <rect x="750" y="318" width="330" height="42" rx="10" fill="#4f46e5" fill-opacity="0.14" stroke="#4f46e5" stroke-opacity="0.4"/>
    <text x="915" y="345" text-anchor="middle">PDF export &amp; download</text>
  </g>

  <line x1="640" y1="378" x2="640" y2="424" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="5" fill="#22d3ee">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M640 380 L640 422"/>
  </circle>

  <!-- Orchestration -->
  <rect x="60" y="432" width="1160" height="238" rx="18" fill="#0b1226" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <text x="90" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">LangGraph Orchestration</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="100" y="500" width="150" height="76" rx="12" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed"/>
    <text x="175" y="544" fill="#e9d5ff">PLAN</text>

    <rect x="290" y="500" width="150" height="76" rx="12" fill="#6d28d9" fill-opacity="0.16" stroke="#8b5cf6"/>
    <text x="365" y="544" fill="#e9d5ff">SEARCH</text>

    <rect x="480" y="500" width="150" height="76" rx="12" fill="#4f46e5" fill-opacity="0.16" stroke="#6366f1"/>
    <text x="555" y="544" fill="#c7d2fe">SCRAPE</text>

    <rect x="670" y="500" width="150" height="76" rx="12" fill="#0891b2" fill-opacity="0.16" stroke="#06b6d4"/>
    <text x="745" y="538" fill="#a5f3fc">RAG</text>
    <text x="745" y="558" fill="#67e8f9" font-size="12">store + retrieve</text>

    <rect x="860" y="500" width="150" height="76" rx="12" fill="#4f46e5" fill-opacity="0.16" stroke="#6366f1"/>
    <text x="935" y="544" fill="#c7d2fe">ANALYZE</text>

    <rect x="1050" y="500" width="150" height="76" rx="12" fill="#06b6d4" fill-opacity="0.18" stroke="#22d3ee"/>
    <text x="1125" y="538" fill="#a5f3fc">SYNTHESIZE</text>
    <text x="1125" y="558" fill="#67e8f9" font-size="12">final report</text>
  </g>

  <g stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" fill="none">
    <line x1="250" y1="538" x2="288" y2="538"/>
    <line x1="440" y1="538" x2="478" y2="538"/>
    <line x1="630" y1="538" x2="668" y2="538"/>
    <line x1="820" y1="538" x2="858" y2="538"/>
    <line x1="1010" y1="538" x2="1048" y2="538"/>
  </g>

  <g fill="#7df9ff">
    <circle r="4"><animateMotion dur="1.6s" repeatCount="indefinite" path="M252 538 L286 538"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.3s" repeatCount="indefinite" path="M442 538 L476 538"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.6s" repeatCount="indefinite" path="M632 538 L666 538"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite" path="M822 538 L856 538"/></circle>
    <circle r="4"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" path="M1012 538 L1046 538"/></circle>
  </g>

  <path class="loop" d="M935 500 C 935 462, 365 462, 365 498" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="4" fill="#c4b5fd">
    <animateMotion dur="3.4s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#looppath" href="#looppath"/>
    </animateMotion>
  </circle>
  <text x="650" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c4b5fd">multi-hop loop while gaps remain</text>

  <!-- Services -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="100" y="722" width="250" height="66" rx="12" fill="#0f1733" stroke="#7c3aed" stroke-opacity="0.5"/>
    <text x="225" y="752" fill="#c4b5fd">Tavily / SerpAPI</text>
    <text x="225" y="774" fill="#7f8fb0" font-size="12" font-weight="400">web search</text>
    <circle class="b1" cx="118" cy="740" r="5" fill="#22c55e"/>

    <rect x="376" y="722" width="250" height="66" rx="12" fill="#0f1733" stroke="#4f46e5" stroke-opacity="0.5"/>
    <text x="501" y="752" fill="#a5b4fc">ChromaDB</text>
    <text x="501" y="774" fill="#7f8fb0" font-size="12" font-weight="400">vector store / RAG</text>
    <circle class="b2" cx="394" cy="740" r="5" fill="#22c55e"/>

    <rect x="652" y="722" width="250" height="66" rx="12" fill="#0f1733" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="777" y="752" fill="#67e8f9">OpenAI GPT-4o</text>
    <text x="777" y="774" fill="#7f8fb0" font-size="12" font-weight="400">reasoning &amp; embeddings</text>
    <circle class="b3" cx="670" cy="740" r="5" fill="#22c55e"/>

    <rect x="928" y="722" width="250" height="66" rx="12" fill="#0f1733" stroke="#8b5cf6" stroke-opacity="0.5"/>
    <text x="1053" y="752" fill="#c4b5fd">LangSmith</text>
    <text x="1053" y="774" fill="#7f8fb0" font-size="12" font-weight="400">tracing &amp; evals</text>
    <circle class="b4" cx="946" cy="740" r="5" fill="#22c55e"/>
  </g>

  <rect class="sweep" x="0" y="812" width="340" height="3" rx="1.5" fill="#22d3ee" opacity="0.75"/>
</svg>
