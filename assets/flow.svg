<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Synthera research flow">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f2b"/>
      <stop offset="1" stop-color="#0b0a1e"/>
    </linearGradient>
    <linearGradient id="fgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="fhalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <path id="fpath" d="M150 150 L1130 150" fill="none"/>
  </defs>

  <style>
    @keyframes dash { to { stroke-dashoffset: -140; } }
    .fl{stroke-dasharray:9 13;animation:dash 4s linear infinite}
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .flt{animation:float 5s ease-in-out infinite}
  </style>

  <rect width="1280" height="260" rx="18" fill="url(#fbg)" stroke="#7c3aed" stroke-opacity="0.35"/>
  <line x1="150" y1="150" x2="1130" y2="150" stroke="url(#fgrad)" stroke-width="3" class="fl" stroke-linecap="round"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g class="flt">
      <circle cx="150" cy="150" r="64" fill="url(#fhalo)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.08;0.25;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <rect x="80" y="108" width="140" height="84" rx="16" fill="#171438" stroke="#7c3aed" stroke-width="2"/>
      <text x="150" y="146" font-size="15" font-weight="700" fill="#e9d5ff">PLAN</text>
      <text x="150" y="168" font-size="11" fill="#9db0d6">sub-queries</text>
    </g>
    <g class="flt">
      <circle cx="346" cy="150" r="64" fill="url(#fhalo)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.08;0.25;1" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <rect x="276" y="108" width="140" height="84" rx="16" fill="#171438" stroke="#8b5cf6" stroke-width="2"/>
      <text x="346" y="146" font-size="15" font-weight="700" fill="#e9d5ff">SEARCH</text>
      <text x="346" y="168" font-size="11" fill="#9db0d6">web results</text>
    </g>
    <g class="flt">
      <circle cx="542" cy="150" r="64" fill="url(#fhalo)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.08;0.25;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <rect x="472" y="108" width="140" height="84" rx="16" fill="#171438" stroke="#6366f1" stroke-width="2"/>
      <text x="542" y="146" font-size="15" font-weight="700" fill="#c7d2fe">SCRAPE</text>
      <text x="542" y="168" font-size="11" fill="#9db0d6">clean text</text>
    </g>
    <g class="flt">
      <circle cx="738" cy="150" r="64" fill="url(#fhalo)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.08;0.25;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <rect x="668" y="108" width="140" height="84" rx="16" fill="#171438" stroke="#06b6d4" stroke-width="2"/>
      <text x="738" y="146" font-size="15" font-weight="700" fill="#a5f3fc">RAG</text>
      <text x="738" y="168" font-size="11" fill="#9db0d6">retrieve</text>
    </g>
    <g class="flt">
      <circle cx="934" cy="150" r="64" fill="url(#fhalo)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.08;0.25;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="864" y="108" width="140" height="84" rx="16" fill="#171438" stroke="#6366f1" stroke-width="2"/>
      <text x="934" y="146" font-size="15" font-weight="700" fill="#c7d2fe">ANALYZE</text>
      <text x="934" y="168" font-size="11" fill="#9db0d6">find gaps</text>
    </g>
    <g class="flt">
      <circle cx="1140" cy="150" r="68" fill="url(#fhalo)" opacity="0">
        <animate attributeName="opacity" values="0;0.4;0;0" keyTimes="0;0.08;0.25;1" dur="3.6s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <rect x="1060" y="108" width="160" height="84" rx="16" fill="#0d2b33" stroke="#22d3ee" stroke-width="2"/>
      <text x="1140" y="146" font-size="15" font-weight="700" fill="#a5f3fc">SYNTHESIZE</text>
      <text x="1140" y="168" font-size="11" fill="#9db0d6">cited report</text>
    </g>
  </g>

  <g fill="#7df9ff">
    <circle r="5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M150 150 L1140 150"/></circle>
    <circle r="3.5" opacity="0.6"><animateMotion dur="3.6s" begin="0.12s" repeatCount="indefinite" path="M150 150 L1140 150"/></circle>
    <circle r="2.5" opacity="0.4"><animateMotion dur="3.6s" begin="0.24s" repeatCount="indefinite" path="M150 150 L1140 150"/></circle>
  </g>

  <text x="640" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="url(#fgrad)">One question in. A fully cited report out.</text>
  <text x="640" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a3c4">every stage streams its progress to the interface in real time</text>
  <text x="150" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#67e8f9">start</text>
  <text x="1140" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#67e8f9">report</text>
</svg>
