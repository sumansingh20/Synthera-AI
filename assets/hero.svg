<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Synthera - Multi-Agent Research and Intelligence Platform">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.45" stop-color="#0a0f2b"/>
      <stop offset="1" stop-color="#160b30"/>
    </linearGradient>
    <radialGradient id="aur1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aur3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hbrand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd">
        <animate attributeName="stop-color" values="#c4b5fd;#67e8f9;#f0abfc;#c4b5fd" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#c084fc;#22d3ee" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="hbeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="hsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="hgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes aur { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(28px,-22px) scale(1.12)} 100%{transform:translate(0,0) scale(1)} }
    @keyframes aur2 { 0%{transform:translate(0,0) scale(1.05)} 50%{transform:translate(-34px,18px) scale(1)} 100%{transform:translate(0,0) scale(1.05)} }
    @keyframes twinkle { 0%,100%{opacity:.15} 50%{opacity:.95} }
    @keyframes rise { 0%{transform:translateY(14px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    @keyframes flow { to { stroke-dashoffset: -200; } }
    @keyframes pulse { 0%,100%{opacity:.35;r:5} 50%{opacity:1;r:8} }
    @keyframes sweep { 0%{transform:translateX(-360px)} 100%{transform:translateX(1340px)} }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes dashdivider { to { stroke-dashoffset: -60; } }
    .a1{animation:aur 11s ease-in-out infinite}
    .a2{animation:aur2 13s ease-in-out infinite}
    .a3{animation:aur 9s ease-in-out infinite}
    .t1{animation:twinkle 3s ease-in-out infinite}
    .t2{animation:twinkle 4.2s ease-in-out infinite .5s}
    .t3{animation:twinkle 3.6s ease-in-out infinite 1s}
    .t4{animation:twinkle 5s ease-in-out infinite .3s}
    .fl{stroke-dasharray:8 12;animation:flow 6s linear infinite}
    .fl2{stroke-dasharray:5 11;animation:flow 3.4s linear infinite}
    .pn{animation:pulse 3.2s ease-in-out infinite}
    .pn2{animation:pulse 3.2s ease-in-out infinite .8s}
    .pn3{animation:pulse 3.2s ease-in-out infinite 1.6s}
    .pn4{animation:pulse 3.2s ease-in-out infinite 2.4s}
    .sweep{animation:sweep 6s linear infinite}
    .ring{animation:spin 26s linear infinite;transform-origin:1040px 210px}
    .divline{stroke-dasharray:6 10;animation:dashdivider 4s linear infinite}
  </style>

  <rect width="1280" height="460" fill="url(#hbg)"/>
  <rect width="1280" height="460" fill="url(#hgrid)"/>
  <g class="a1"><circle cx="220" cy="120" r="260" fill="url(#aur1)"/></g>
  <g class="a2"><circle cx="1120" cy="330" r="280" fill="url(#aur2)"/></g>
  <g class="a3"><circle cx="760" cy="40" r="200" fill="url(#aur3)"/></g>

  <g fill="#dbeafe">
    <circle class="t1" cx="120" cy="70" r="1.8"/>
    <circle class="t2" cx="300" cy="380" r="2.2"/>
    <circle class="t3" cx="520" cy="90" r="1.6"/>
    <circle class="t4" cx="700" cy="410" r="2.0"/>
    <circle class="t2" cx="880" cy="70" r="1.7"/>
    <circle class="t3" cx="1180" cy="140" r="2.1"/>
    <circle class="t1" cx="1250" cy="400" r="1.6"/>
    <circle class="t4" cx="60" cy="300" r="2.0"/>
    <circle class="t2" cx="980" cy="360" r="1.6"/>
    <circle class="t1" cx="430" cy="250" r="1.5"/>
  </g>

  <g transform="translate(150,120)">
    <circle cx="0" cy="0" r="86" fill="none" stroke="#818cf8" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(66,124) scale(0.68)">
    <rect x="0" y="0" width="240" height="240" rx="56" fill="#0b1020" stroke="url(#hbrand)" stroke-opacity="0.6" stroke-width="3"/>
    <g stroke="url(#hbrand)" stroke-width="6" stroke-linecap="round">
      <line class="fl" x1="120" y1="120" x2="120" y2="50"/>
      <line class="fl2" x1="120" y1="120" x2="180" y2="85"/>
      <line class="fl" x1="120" y1="120" x2="180" y2="155"/>
      <line class="fl2" x1="120" y1="120" x2="120" y2="190"/>
      <line class="fl" x1="120" y1="120" x2="60" y2="155"/>
      <line class="fl2" x1="120" y1="120" x2="60" y2="85"/>
    </g>
    <g fill="#22d3ee">
      <circle class="pn" cx="120" cy="50" r="10"/>
      <circle class="pn2" cx="180" cy="85" r="10"/>
      <circle class="pn3" cx="180" cy="155" r="10"/>
      <circle class="pn4" cx="120" cy="190" r="10"/>
      <circle class="pn" cx="60" cy="155" r="10"/>
      <circle class="pn3" cx="60" cy="85" r="10"/>
    </g>
    <circle cx="120" cy="120" r="26" fill="url(#hbrand)" filter="url(#hsoft)"/>
    <circle cx="120" cy="120" r="9" fill="#05060f" opacity="0.55"/>
  </g>

  <text x="300" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="2" fill="url(#hbrand)" filter="url(#hsoft)">SYNTHERA</text>
  <text x="304" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#9db0d6">Multi-Agent Research &amp; Intelligence Platform</text>

  <line class="divline" x1="304" y1="288" x2="840" y2="288" stroke="url(#hbeam)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="304" y="308" width="140" height="36" rx="18" fill="#7c3aed" fill-opacity="0.16" stroke="#7c3aed" stroke-opacity="0.55"/>
    <text x="374" y="332" text-anchor="middle" fill="#c4b5fd">LangGraph</text>
    <rect x="456" y="308" width="118" height="36" rx="18" fill="#4f46e5" fill-opacity="0.16" stroke="#4f46e5" stroke-opacity="0.55"/>
    <text x="515" y="332" text-anchor="middle" fill="#a5b4fc">FastAPI</text>
    <rect x="586" y="308" width="140" height="36" rx="18" fill="#06b6d4" fill-opacity="0.16" stroke="#06b6d4" stroke-opacity="0.55"/>
    <text x="656" y="332" text-anchor="middle" fill="#67e8f9">ChromaDB</text>
    <rect x="738" y="308" width="132" height="36" rx="18" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.55"/>
    <text x="804" y="332" text-anchor="middle" fill="#c4b5fd">Streamlit</text>
    <rect x="882" y="308" width="146" height="36" rx="18" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-opacity="0.5"/>
    <text x="955" y="332" text-anchor="middle" fill="#f9a8d4">LangSmith</text>
  </g>

  <g transform="translate(1050,150)">
    <circle cx="0" cy="0" r="120" fill="url(#aur1)"/>
    <g fill="none" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.4">
      <circle cx="0" cy="0" r="60">
        <animate attributeName="r" values="40;70;40" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0.05;0.6" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="42">
        <animate attributeName="r" values="26;52;26" dur="6s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0.05;0.5" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#22d3ee">
      <circle class="pn" cx="0" cy="-70" r="7"/>
      <circle class="pn2" cx="60" cy="35" r="7"/>
      <circle class="pn3" cx="-60" cy="35" r="7"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="url(#hbrand)" filter="url(#hsoft)"/>
  </g>

  <rect class="sweep" x="0" y="430" width="360" height="3" rx="1.5" fill="url(#hbeam)"/>
</svg>
